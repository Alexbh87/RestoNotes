<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restos">
<meta name="theme-color" content="#ffffff">
<title>Resto Notes</title>

<style>
:root{--bg:#fff;--card:#fff;--line:#e8e5e1;--txt:#252321;--mut:#77736e;--acc:#e86f45;--nav:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.view{display:none;position:absolute;left:0;right:0;top:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));overflow:auto}
.view.active{display:block}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:900;box-shadow:0 -3px 14px rgba(30,25,20,.05)}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--acc)}nav button[data-v="cam"]{color:#fff;background:var(--acc);border-radius:18px;margin:7px 8px;font-weight:700}nav button[data-v="cam"] span{font-size:24px}
/* ajout manuel */
.addWrap{padding:0 18px 28px;max-width:620px;margin:0 auto}
.addWrap label{margin-top:16px}
.addWrap input{font-size:16px;padding:14px}
.addFind{width:100%;margin-top:20px}
.addResult{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 3px 14px rgba(30,25,20,.06)}
.addResult[hidden]{display:none}
.addResult>img{display:block;width:100%;height:210px;object-fit:cover;background:#f2efeb}
.addInfo{padding:14px 16px}
.addInfo h2{margin:0 0 6px;font-size:21px}
.addInfo p{margin:5px 0;color:var(--mut)}
.addInfo a{display:inline-block;color:var(--acc);margin:8px 14px 0 0;font-weight:600}
#btnAddResult{width:calc(100% - 28px);margin:0 14px 14px}
/* caméra */
#v-cam{overflow:hidden;background:#fff}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camErr{position:absolute;left:16px;right:16px;top:30%;text-align:center;color:var(--mut)}
#camErr .btn{margin-top:12px}
.camBar{position:absolute;left:0;right:0;bottom:24px;display:flex;align-items:center;justify-content:space-around}
.side{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
#shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(0,0,0,.3)}
#shutter:active{transform:scale(.93)}
/* liste */
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
h1{margin:0;font-size:24px}
.hbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-left:6px;cursor:pointer;display:inline-block}
#q{display:block;width:calc(100% - 32px);margin:8px 16px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}
.chips:empty{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.typechips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px;scrollbar-width:none}.typechips:empty{display:none}#list{padding:8px 12px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;min-width:0;box-shadow:0 2px 10px rgba(30,25,20,.045)}
.card img{width:100%;height:118px;object-fit:cover;flex:none;background:#f2efeb}
.card div{padding:9px 10px 11px;min-width:0}
.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--mut)}
.topBtn{width:100%;padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--acc);font-weight:700;cursor:pointer}
.topBtn.on{background:#fff2ec;border-color:var(--acc)}
.empty{color:var(--mut);text-align:center;padding:40px 16px}
/* carte */
#v-map{overflow:hidden}
#map{position:absolute;inset:0}
.mapBtns{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:800;display:grid;gap:8px}
.mapBtns button{background:#fff;color:#111;border:0;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.35);font-weight:600}
.pin{width:34px;height:34px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:var(--acc);border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pin{font-size:0}
.pin::after{content:"🍽️";font-size:16px;transform:rotate(45deg)}
/* feuilles */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:flex;align-items:flex-end}
.overlay[hidden]{display:none}
.panel{width:100%;max-height:94dvh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));color:var(--txt)}
.panel img.shot{width:100%;max-height:34dvh;object-fit:cover;border-radius:12px;background:#000}
label{display:block;margin-top:12px;font-size:13px;color:var(--mut)}
label input,label textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--txt)}
.row{display:flex;gap:10px}.row>*{flex:1}
.hint{margin:10px 0 2px;font-size:14px;color:var(--mut)}
.primary,.ghost,.btn{border-radius:12px;padding:13px 14px;border:1px solid var(--line);font-weight:600;cursor:pointer;text-align:center;display:block;text-decoration:none}
.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.ghost,.btn{background:var(--card);color:var(--txt)}
.danger{color:#ff6b6b}
.stack{display:grid;gap:10px;margin-top:14px}
#detailBody h2{margin:12px 0 2px}
#detailBody p{margin:4px 0;color:var(--mut)}
#detailBody pre{white-space:pre-wrap;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;z-index:3000;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>
<body>

<section id="v-cam" class="view active">
  <video id="video" autoplay playsinline muted></video>
  <div id="camErr" hidden>
    <div>📷 L'appareil photo n'est pas accessible ici.<br>Autorise-le dans le navigateur, ou utilise le bouton ci-dessous.</div>
    <label class="btn">Ouvrir l'appareil photo<input id="fileCam" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
  <div class="camBar">
    <span class="side" style="visibility:hidden"></span>
    <button id="shutter" aria-label="Prendre la photo"></button>
    <span class="side" style="visibility:hidden"></span>
  </div>
</section>

<section id="v-list" class="view">
  <header>
    <h1>À tester</h1>
    <div>
      <button class="hbtn" id="btnExport" title="Sauvegarder (fichier)">⬇︎</button>
    </div>
  </header>
  <input id="q" type="search" placeholder="Rechercher : nom, quartier, ville, pays, plat…">
  <div id="cities" class="chips"></div>
  <div id="dists" class="chips"></div>
  <div id="types" class="typechips"></div>
  <div id="list"></div>
</section>

<section id="v-top" class="view">
<header><h1>Mon Top</h1></header>
<input id="topQ" type="search" placeholder="Rechercher par nom…">
<div id="topCities" class="chips"></div><div id="topDists" class="chips"></div><div id="topTypes" class="typechips"></div>
<div style="padding:10px 16px"><button id="btnShareTop" class="primary" style="width:100%">✉️ Partager cette sélection par e-mail</button></div><div id="topList"></div>
</section>
<section id="v-add" class="view">
  <header><h1>Ajouter un restaurant</h1></header>
  <div class="addWrap">
    <p class="hint">Indique son nom et sa ville. RestoNotes recherche sa fiche et te la présente avant de l'ajouter.</p>
    <label>Nom du restaurant<input id="addName" placeholder="Ex. Can Fisher" autocomplete="off"></label>
    <label>Ville<input id="addCity" placeholder="Ex. Barcelone" autocomplete="off"></label>
    <button id="btnFind" class="primary addFind">✨ Rechercher le restaurant</button>
    <div id="addStatus" class="hint" aria-live="polite"></div>
    <article id="addResult" class="addResult" hidden>
      <img id="addPhoto" alt="Photo du restaurant">
      <div class="addInfo">
        <h2 id="addTitle"></h2>
        <p id="addType"></p><p id="addAddress"></p>
        <a id="addWebsite" target="_blank" rel="noopener" hidden>Site officiel</a>
        <a id="addMenu" target="_blank" rel="noopener" hidden>Voir le menu</a>
      </div>
      <button id="btnAddResult" class="primary">＋ Ajouter à mon RestoNotes</button>
    </article>
  </div>
</section>

<section id="v-map" class="view">
  <div id="map"></div>
  <div class="mapBtns">
    <button id="btnMe">📍 Ma position</button>
    <button id="btnAll">🗺️ Tout voir</button>
  </div>
</section>

<nav>
  <button data-v="list"><span>📖</span>À tester</button>
  <button data-v="cam" class="on"><span>📷</span>Photo</button>
  <button data-v="add"><span>＋</span>Ajout</button>
  <button data-v="top"><span>⭐</span>Mon Top</button>
  <button data-v="map"><span>🗺️</span>Carte</button>
</nav>

<div id="sheet" class="overlay" hidden>
  <div class="panel">
    <img id="shotImg" class="shot" alt="">
    <div id="status" class="hint"></div>
    <div id="sugg" class="chips" style="padding:4px 0"></div>
    <label>Nom du restaurant<input id="iName" autocomplete="off"></label>
    <label>Adresse<input id="iAddr" autocomplete="off"></label>
    <div class="row">
      <label>Quartier<input id="iDist" autocomplete="off"></label>
      <label>Ville<input id="iCity" autocomplete="off"></label>
    </div>
    <label>Pays<input id="iCountry" autocomplete="off"></label>
    <label>Type de restaurant<input id="iType" autocomplete="off" placeholder="Italien, japonais, tapas…"></label>
    <label>Site web<input id="iWeb" type="url" autocomplete="off"></label>
    <label>Menu / notes<textarea id="iMenu" rows="5" placeholder="Plats, prix, envies… ou lance la lecture du texte de la photo"></textarea></label>
    <div class="stack">
      <button id="btnOcr" class="ghost">🔍 Lire le texte de la photo (enseigne, menu)</button>
      <div class="row">
        <button id="btnCancel" class="ghost">Annuler</button>
        <button id="btnSave" class="primary">Enregistrer</button>
      </div>
    </div>
  </div>
</div>

<div id="detail" class="overlay" hidden><div class="panel" id="detailBody"></div></div>
<div id="toast"></div>


<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

let items = [], me = null, draft = null, suggData = [];
let map = null, markers = [], meMarker = null, infoWindow = null, mapLoading = false;
let selCity = '', selDist = '', selType = '', topSelCity = '', topSelDist = '', topSelType = '', view = 'cam', stream = null;

/* ---------- stockage (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('resto-notes', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('r', { keyPath: 'id' });
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  store(mode) { return this.db.transaction('r', mode).objectStore('r'); },
  all() { return new Promise(res => { const q = this.store('readonly').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); }); },
  put(o) { return new Promise((res, rej) => { const q = this.store('readwrite').put(o); q.onsuccess = () => res(); q.onerror = () => rej(q.error); }); },
  del(id) { return new Promise(res => { const q = this.store('readwrite').delete(id); q.onsuccess = () => res(); q.onerror = () => res(); }); }
};

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- navigation ---------- */
function showView(v) {
  view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('active', e.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'cam') startCam(); else stopCam();
  if (v === 'list') renderList();
  if (v === 'top') renderTop();
  if (v === 'map') initMap();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.v));

/* ---------- caméra ---------- */
async function startCam() {
  if (stream) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false });
    $('#video').srcObject = stream;
    $('#camErr').hidden = true;
  } catch (e) {
    $('#camErr').hidden = false;
  }
}
function stopCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}
function toDataUrl(src, w, h) {
  const s = Math.min(1, 1024 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}
const getPos = () => new Promise((res, rej) => {
  if (!navigator.geolocation) return rej();
  navigator.geolocation.getCurrentPosition(
    p => res({ lat: p.coords.latitude, lon: p.coords.longitude }), rej,
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
});

$('#shutter').onclick = () => {
  const v = $('#video');
  if (!v.videoWidth) { toast('Caméra pas prête'); return; }
  const posP = getPos().catch(() => me);
  const url = toDataUrl(v, v.videoWidth, v.videoHeight);
  newFromImage(url, posP, false);
};
function fromFile(input) {
  const f = input.files[0]; input.value = '';
  if (!f) return;
  const posP = getPos().catch(() => me);
  const img = new Image();
  img.onload = () => { newFromImage(toDataUrl(img, img.naturalWidth, img.naturalHeight), posP, input.id === 'fileGal'); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f);
}
$('#fileCam').onchange = e => fromFile(e.target);

/* ---------- géocodage & recherche autour de soi ---------- */
async function reverse(lat, lon) {
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&accept-language=fr&zoom=18&lat=${lat}&lon=${lon}`);
  const a = (await r.json()).address || {};
  return {
    address: [a.house_number, a.road].filter(Boolean).join(' '),
    district: a.suburb || a.neighbourhood || a.city_district || a.quarter || '',
    city: a.city || a.town || a.village || a.municipality || '',
    country: a.country || ''
  };
}
function dist(lat1, lon1, lat2, lon2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
async function nearby(lat, lon) {
  const q = `[out:json][timeout:10];nwr(around:60,${lat},${lon})["name"]["amenity"~"restaurant|cafe|fast_food|bar|pub|ice_cream|food_court"];out center tags 25;`;
  const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) });
  const j = await r.json();
  return (j.elements || []).map(e => {
    const la = e.lat ?? e.center?.lat, lo = e.lon ?? e.center?.lon;
    return { tags: e.tags, d: dist(lat, lon, la, lo) };
  }).sort((a, b) => a.d - b.d).slice(0, 6);
}

/* ---------- feuille « nouveau resto » ---------- */
const fields = { name: '#iName', address: '#iAddr', district: '#iDist', city: '#iCity', country: '#iCountry', type: '#iType', website: '#iWeb', menu: '#iMenu' };
function fillForm(d) { for (const k in fields) $(fields[k]).value = d[k] || ''; }
function setIfEmpty(k, v) { const el = $(fields[k]); if (v && !el.value.trim()) el.value = v; }
function setStatus(t) { $('#status').textContent = t; }

function openSheet(d) {
  draft = d; suggData = [];
  stopCam();
  $('#shotImg').src = d.photo;
  $('#sugg').innerHTML = '';
  fillForm(d);
  $('#btnOcr').disabled = false;
  $('#sheet').hidden = false;
  $('#sheet .panel').scrollTop = 0;
}
function closeSheet() {
  $('#sheet').hidden = true; draft = null;
  if (view === 'cam') startCam();
}

async function newFromImage(photo, posP, fromGallery) {
  const d = { photo, lat: null, lon: null };
  openSheet(d);
  setStatus('📍 Localisation en cours…');
  const pos = await posP;
  if (draft !== d) return;
  if (!pos) { setStatus('⚠️ Position introuvable : remplis les champs à la main.'); return; }
  d.lat = pos.lat; d.lon = pos.lon;
  setStatus((fromGallery ? '(Photo importée : ta position actuelle est utilisée.) ' : '') + '🔎 Recherche de l\'adresse et des restos autour…');
  const [a, n] = await Promise.allSettled([reverse(pos.lat, pos.lon), nearby(pos.lat, pos.lon)]);
  if (draft !== d) return;
  if (a.status === 'fulfilled') for (const k of ['address', 'district', 'city', 'country']) setIfEmpty(k, a.value[k]);
  if (n.status === 'fulfilled' && n.value.length) {
    suggData = n.value;
    $('#sugg').innerHTML = suggData.map((s, i) => `<button class="chip" data-i="${i}">${esc(s.tags.name)} · ${Math.round(s.d)} m</button>`).join('');
    applySuggestion(0, true);
    setStatus('✅ Vérifie le nom (le plus proche est pré-rempli) ou choisis-en un autre :');
  } else {
    setStatus(n.status === 'fulfilled' ? 'Aucun restaurant trouvé à proximité : saisis le nom.' : '⚠️ Recherche des restos impossible (réseau ?) : saisis le nom.');
  }
  // Le GPS et le nom suggéré sont maintenant disponibles pour identifier le bon établissement.
  enrichRestaurant(d).catch(() => {});
}
function applySuggestion(i, onlyIfEmpty) {
  const s = suggData[i]; if (!s) return;
  const t = s.tags;
  if (onlyIfEmpty) setIfEmpty('name', t.name); else $('#iName').value = t.name;
  const street = [t['addr:housenumber'], t['addr:street']].filter(Boolean).join(' ');
  if (street && !onlyIfEmpty) $('#iAddr').value = street;
  const web = t.website || t['contact:website'];
  if (web) { if (onlyIfEmpty) setIfEmpty('website', web); else $('#iWeb').value = web; }
  document.querySelectorAll('#sugg .chip').forEach((c, j) => c.classList.toggle('on', j === i));
}
$('#sugg').onclick = e => { const b = e.target.closest('.chip'); if (b) applySuggestion(+b.dataset.i, false); };

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
$('#btnOcr').onclick = async () => {
  const btn = $('#btnOcr'); btn.disabled = true;
  setStatus('🔍 Lecture du texte… (la 1re fois, un modèle est téléchargé, ça peut prendre un moment)');
  try {
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    const { data } = await Tesseract.recognize(draft.photo, 'fra+eng');
    const txt = (data.text || '').trim();
    if (txt) { const m = $('#iMenu'); m.value = (m.value ? m.value + '\n' : '') + txt; setStatus('✅ Texte ajouté dans « Menu / notes » : relis-le et corrige si besoin.'); }
    else setStatus('Aucun texte lisible sur la photo.');
  } catch (e) { setStatus('⚠️ Lecture du texte impossible (réseau ?).'); }
  btn.disabled = false;
};


async function callEnrichment(payload) {
  const r = await fetch('/.netlify/functions/enrich-resto', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Enrichissement indisponible');
  return data;
}
async function enrichRestaurant(d) {
  setStatus('✨ Lecture du nom sur la façade et identification du restaurant…');
  try {
    const data=await callEnrichment({
      photo:d.photo,
      name:$('#iName').value,
      address:$('#iAddr').value,
      city:$('#iCity').value,
      lat:d.lat,
      lon:d.lon
    });
    if(draft!==d) return;
    if(data.name) setIfEmpty('name',data.name);
    if(data.type) { d.type=data.type; $('#iType').value=data.type; }
    if(data.website) setIfEmpty('website',data.website);
    if(data.facadeImageUrl) d.facadePhoto=data.facadeImageUrl;
    if(data.menuUrl) d.menuUrl=data.menuUrl;
    setStatus(data.type
      ? '✨ Restaurant identifié : '+($('#iName').value || data.name)+'. Type : '+data.type+'. Vérifie avant d’enregistrer.'
      : 'Analyse terminée. Vérifie le nom et choisis le type si nécessaire.');
  } catch(e) { setStatus('ℹ️ Identification automatique indisponible. Tu peux compléter la fiche manuellement.'); }
}

$('#btnCancel').onclick = closeSheet;
$('#btnSave').onclick = async () => {
  const rec = {
    ...draft,
    id: draft.id || Date.now().toString(36),
    date: draft.date || new Date().toISOString()
  };
  for (const k in fields) rec[k] = $(fields[k]).value.trim();
  if (!rec.name) rec.name = 'Restaurant sans nom';
  await DB.put(rec);
  items = await DB.all();
  closeSheet();
  toast('Restaurant enregistré ✔︎');
  if (view === 'list') renderList();
  if (view === 'map') drawMarkers(false);
};

/* ---------- ajout par nom + ville ---------- */
let addCandidate = null;
function setAddStatus(message){ $('#addStatus').textContent=message; }
function showAddCandidate(place){
  addCandidate=place;
  $('#addTitle').textContent=place.name || 'Restaurant';
  $('#addType').textContent=place.type ? '🍽️ '+place.type : '';
  $('#addAddress').textContent=place.address ? '📍 '+place.address : '';
  $('#addPhoto').src=place.photo || '';
  $('#addWebsite').hidden=!place.website;
  if(place.website) $('#addWebsite').href=place.website;
  $('#addMenu').hidden=!place.menuUrl;
  if(place.menuUrl) $('#addMenu').href=place.menuUrl;
  $('#addResult').hidden=false;
}
$('#btnFind').onclick=async()=>{
  const name=$('#addName').value.trim(), city=$('#addCity').value.trim();
  if(!name || !city){setAddStatus('Indique le nom du restaurant et la ville.');return;}
  const btn=$('#btnFind'); btn.disabled=true; $('#addResult').hidden=true; addCandidate=null;
  setAddStatus('✨ Recherche du restaurant, de sa photo et de son menu…');
  try{
    const r=await fetch('/.netlify/functions/enrich-resto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lookup:true,name,city})});
    const data=await r.json();
    if(!r.ok) throw new Error(data.error || 'Recherche indisponible');
    if(!data.name) {setAddStatus('Aucun résultat fiable trouvé. Vérifie le nom ou la ville.');return;}
    showAddCandidate(data);
    setAddStatus('Fiche trouvée. Recherche du menu en ligne…');
    // Menu search is optional: the restaurant can still be added if AI/menu lookup is unavailable.
    try{
      const mr=await fetch('/.netlify/functions/enrich-resto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({findMenu:true,name:data.name,address:data.address,city:city,type:data.type})});
      const md=await mr.json();
      if(md.menuUrl){addCandidate.menuUrl=md.menuUrl;$('#addMenu').href=md.menuUrl;$('#addMenu').hidden=false;}
      else if(data.website){$('#addMenu').href=data.website;$('#addMenu').textContent='Site / menu du restaurant';$('#addMenu').hidden=false;}
    }catch(e){if(data.website){$('#addMenu').href=data.website;$('#addMenu').textContent='Site du restaurant';$('#addMenu').hidden=false;}}
    setAddStatus('Vérifie que c’est bien le bon établissement avant de l’ajouter.');
  }catch(e){setAddStatus('Recherche impossible : '+(e.message || 'réessaie dans un instant.'));}
  finally{btn.disabled=false;}
};
$('#btnAddResult').onclick=async()=>{
  if(!addCandidate)return;
  const p=addCandidate;
  const rec={
    id:Date.now().toString(36),date:new Date().toISOString(),
    name:p.name,address:p.address||'',city:$('#addCity').value.trim(),
    district:p.district||'',country:'',type:p.type||'',website:p.website||'',
    menu:'',menuUrl:p.menuUrl||'',photo:p.photo||'',facadePhoto:p.photo||'',
    lat:p.lat??null,lon:p.lon??null
  };
  try{await DB.put(rec);items=await DB.all();toast('Restaurant ajouté au répertoire et à la carte ✔︎');addCandidate=null;$('#addResult').hidden=true;$('#addName').value='';$('#addCity').value='';setAddStatus('Ton restaurant est enregistré.');}
  catch(e){toast('Enregistrement impossible');}
};

/* ---------- À tester et Mon Top ---------- */
function cardHtml(i,button){return `<article class="card" data-id="${esc(i.id)}"><img src="${esc(i.facadePhoto||i.photo||'')}" alt=""><div><b>${esc(i.name)}</b><small>${esc([i.type,i.district,i.city].filter(Boolean).join(' · ')||'Lieu à compléter')}</small></div>${button?`<div style="padding:0 10px 10px"><button class="topBtn" data-top="${esc(i.id)}">${i.isTop?'★ Dans Mon Top':'☆ Top'}</button></div>`:''}</article>`}
async function toggleTop(id){const i=items.find(x=>x.id===id);if(!i)return;i.isTop=!i.isTop;await DB.put(i);items=await DB.all();renderList();if(view==='top')renderTop();if(!$('#detail').hidden)openDetail(id);toast(i.isTop?'Ajouté à Mon Top ⭐':'Retiré de Mon Top');}
function renderList(){
 const cities=[...new Set(items.map(i=>i.city).filter(Boolean))].sort(),dists=[...new Set(items.filter(i=>!selCity||i.city===selCity).map(i=>i.district).filter(Boolean))].sort(),types=[...new Set(items.map(i=>i.type).filter(Boolean))].sort();
 const chips=(k,vals,sel,all)=>vals.map(v=>`<button class="chip${v===sel?' on':''}" data-${k}="${esc(v)}">${esc(v||all)}</button>`).join('');
 $('#cities').innerHTML=chips('city',['',...cities],selCity,'Toutes les villes');$('#dists').innerHTML=chips('dist',['',...dists],selDist,'Tous les quartiers');$('#types').innerHTML=chips('type',['',...types],selType,'Tous les types');
 const q=norm($('#q').value.trim()),res=items.filter(i=>(!selCity||i.city===selCity)&&(!selDist||i.district===selDist)&&(!selType||i.type===selType)&&(!q||norm([i.name,i.address,i.district,i.city,i.country,i.menu].join(' ')).includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 $('#list').innerHTML=res.length?res.map(i=>cardHtml(i,true)).join(''):`<div class="empty">${items.length?'Aucun résultat.':'Aucun restaurant enregistré pour l\'instant.<br>Ajoute ton premier restaurant 📷'}</div>`;
}
function renderTop(){
 const arr=items.filter(i=>i.isTop),cities=[...new Set(arr.map(i=>i.city).filter(Boolean))].sort(),dists=[...new Set(arr.filter(i=>!topSelCity||i.city===topSelCity).map(i=>i.district).filter(Boolean))].sort(),types=[...new Set(arr.map(i=>i.type).filter(Boolean))].sort();
 const chips=(k,vals,sel,all)=>vals.map(v=>`<button class="chip${v===sel?' on':''}" data-top-${k}="${esc(v)}">${esc(v||all)}</button>`).join('');
 $('#topCities').innerHTML=chips('city',['',...cities],topSelCity,'Toutes les villes');$('#topDists').innerHTML=chips('dist',['',...dists],topSelDist,'Tous les quartiers');$('#topTypes').innerHTML=chips('type',['',...types],topSelType,'Tous les types');
 const q=norm($('#topQ').value.trim()),res=arr.filter(i=>(!topSelCity||i.city===topSelCity)&&(!topSelDist||i.district===topSelDist)&&(!topSelType||i.type===topSelType)&&(!q||norm(i.name).includes(q))).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
 $('#topList').innerHTML=res.length?res.map(i=>cardHtml(i,false)).join(''):'<div class="empty">Ton Top est encore vide. Marque ⭐ les restaurants que tu as adorés dans « À tester ».</div>';
}
$('#q').oninput=renderList;$('#cities').onclick=e=>{let b=e.target.closest('[data-city]');if(b){selCity=b.dataset.city;selDist='';renderList();}};$('#dists').onclick=e=>{let b=e.target.closest('[data-dist]');if(b){selDist=b.dataset.dist;renderList();}};$('#types').onclick=e=>{let b=e.target.closest('[data-type]');if(b){selType=b.dataset.type;renderList();}};
$('#list').onclick=e=>{let t=e.target.closest('[data-top]');if(t){e.stopPropagation();toggleTop(t.dataset.top);return;}let c=e.target.closest('.card');if(c)openDetail(c.dataset.id);};
$('#topQ').oninput=renderTop;$('#topCities').onclick=e=>{let b=e.target.closest('[data-top-city]');if(b){topSelCity=b.dataset.topCity;topSelDist='';renderTop();}};$('#topDists').onclick=e=>{let b=e.target.closest('[data-top-dist]');if(b){topSelDist=b.dataset.topDist;renderTop();}};$('#topTypes').onclick=e=>{let b=e.target.closest('[data-top-type]');if(b){topSelType=b.dataset.topType;renderTop();}};
$('#topList').onclick=e=>{let c=e.target.closest('.card');if(c)openDetail(c.dataset.id);};
$('#btnShareTop').onclick=()=>{const q=norm($('#topQ').value.trim()),arr=items.filter(i=>i.isTop&&(!topSelCity||i.city===topSelCity)&&(!topSelDist||i.district===topSelDist)&&(!topSelType||i.type===topSelType)&&(!q||norm(i.name).includes(q)));if(!arr.length){toast('Aucun restaurant dans cette sélection');return;}const body='Voici mes bonnes adresses :\n\n'+arr.map(i=>[`• ${i.name}`,[i.type,i.district,i.city].filter(Boolean).join(' · '),i.address||'',i.lat!=null?`https://www.google.com/maps/search/?api=1&query=${i.lat},${i.lon}`:'' ].filter(Boolean).join('\n')).join('\n\n');location.href='mailto:?subject='+encodeURIComponent('Mes bonnes adresses RestoNotes')+'&body='+encodeURIComponent(body);};

function openDetail(id) {
  const i = items.find(x => x.id === id); if (!i) return;
  const place = [i.district, i.city].filter(Boolean).join(' · ');
  const web = /^https?:\/\//i.test(i.website || '') ? i.website : (i.website ? 'https://' + i.website : '');
  $('#detailBody').innerHTML = `
    <img class="shot" src="${i.photo}" alt="">
    <h2>${esc(i.name)}</h2>
    ${i.type ? `<p>🍽️ ${esc(i.type)}</p>` : ''}
    ${place ? `<p>📍 ${esc(place)}${i.country ? ', ' + esc(i.country) : ''}</p>` : (i.country ? `<p>${esc(i.country)}</p>` : '')}
    ${i.address ? `<p>${esc(i.address)}</p>` : ''}
    ${web ? `<p><a href="${esc(web)}" target="_blank" rel="noopener" style="color:var(--acc)">${esc(i.website)}</a></p>` : ''}
    ${i.menu ? `<pre>${esc(i.menu)}</pre>` : ''}
    ${i.menuUrl ? `<p><a href="${esc(i.menuUrl)}" target="_blank" rel="noopener" style="color:var(--acc)">📖 Consulter le menu en ligne</a></p>` : ''}
    <div class="stack">
      ${i.lat != null ? `<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${i.lat},${i.lon}">🧭 Itinéraire</a>
      <button class="ghost" id="dMap">🗺️ Voir sur la map</button>` : ''}
      <button class="ghost" id="dMenu">🌐 Rechercher le menu avec l’IA</button>
      <button class="ghost" id="dEdit">✏️ Modifier</button>
      <button class="ghost danger" id="dDel">🗑️ Supprimer</button>
      <button class="ghost" id="dClose">Fermer</button>
    </div>`;
  $('#detail').hidden = false;
  $('#detailBody').scrollTop = 0;
  $('#dClose').onclick = () => $('#detail').hidden = true;
  $('#dMenu').onclick = async () => { const b=$('#dMenu'); b.disabled=true; b.textContent='Recherche du menu…'; try { const data=await callEnrichment({name:i.name,address:i.address,city:i.city,type:i.type,findMenu:true}); if(data.menuUrl||data.menuText){i.menuUrl=data.menuUrl||i.menuUrl;i.menu=data.menuText||i.menu;await DB.put(i);items=await DB.all();openDetail(i.id);toast('Recherche terminée ✔︎');} else toast('Aucun menu fiable trouvé'); } catch(e){toast('IA indisponible : vérifie la clé API Netlify');} };
  $('#dEdit').onclick = () => { $('#detail').hidden = true; openSheet({ ...i }); setStatus('Modification de la fiche.'); };
  $('#dDel').onclick = async () => {
    if (!confirm('Supprimer « ' + i.name + ' » ?')) return;
    await DB.del(i.id); items = await DB.all();
    $('#detail').hidden = true; renderList(); if (map) drawMarkers(false);
  };
  const dm = $('#dMap');
  if (dm) dm.onclick = () => { $('#detail').hidden = true; showView('map'); setTimeout(() => { if (map) { map.setCenter({ lat: Number(i.lat), lng: Number(i.lon) }); map.setZoom(17); } }, 300); };
}
$('#detail').onclick = e => { if (e.target.id === 'detail') $('#detail').hidden = true; };

/* ---------- carte ---------- */
function initMap() {
  if (window.google?.maps) {
    if (!map) createGoogleMap();
    else { drawMarkers(true); updateMe(); }
    return;
  }
  if (mapLoading) return;
  mapLoading = true;
  fetch('/.netlify/functions/maps-config')
    .then(r => { if (!r.ok) throw new Error('Configuration Google Maps indisponible'); return r.json(); })
    .then(config => {
      if (!config.key) throw new Error('Clé Google Maps absente');
      window.initRestoGoogleMap = () => createGoogleMap();
      const script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(config.key) + '&callback=initRestoGoogleMap&loading=async';
      script.async = true;
      script.onerror = () => { mapLoading = false; toast('Chargement de Google Maps impossible'); };
      document.head.appendChild(script);
    })
    .catch(err => { mapLoading = false; toast(err.message || 'Carte indisponible'); });
}
function createGoogleMap() {
  map = new google.maps.Map($('#map'), {
    center: { lat: 48.8566, lng: 2.3522 },
    zoom: 12,
    mapTypeControl: false,
    streetViewControl: false,
    fullscreenControl: false
  });
  infoWindow = new google.maps.InfoWindow();
  drawMarkers(true);
  updateMe();
}
function restaurantIcon(type) {
  const t = norm(type);
  if (/sushi|japon|japanese/.test(t)) return '🍣';
  if (/italien|italian|pizza|pizzeria/.test(t)) return '🍕';
  if (/chinois|chinese/.test(t)) return '🥢';
  if (/indien|indian/.test(t)) return '🍛';
  if (/mexicain|mexican|taco/.test(t)) return '🌮';
  if (/francais|française|gastronom|bistrot|brasserie/.test(t)) return '🍷';
  if (/burger|americain|american/.test(t)) return '🍔';
  if (/libanais|levantin|middle eastern|moyen-orient/.test(t)) return '🥙';
  if (/veget|vegan|healthy|salade/.test(t)) return '🥑';
  if (/cafe|café|brunch|coffee/.test(t)) return '☕';
  if (/thai|thailandais/.test(t)) return '🍜';
  if (/seafood|poisson|fruits de mer|sushi/.test(t)) return '🐟';
  if (/espagnol|tapas|paella/.test(t)) return '🥘';
  return '🍴';
}
function drawMarkers(fit) {
  if (!map || !window.google?.maps) return;
  markers.forEach(m => m.setMap(null));
  markers = items.filter(i => i.lat != null && i.lon != null).map(i => {
    const marker = new google.maps.Marker({
      position: { lat: Number(i.lat), lng: Number(i.lon) },
      map,
      title: i.name,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 17,
        fillColor: '#e86f45',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 2
      },
      label: {
        text: restaurantIcon(i.type),
        fontSize: '17px'
      }
    });
    marker.addListener('click', () => {
      infoWindow.setContent(`<div style="color:#252321"><b>${esc(i.name)}</b><br>${esc([i.district, i.city].filter(Boolean).join(' · '))}<br><a href="#" data-open="${esc(i.id)}">Voir la fiche</a></div>`);
      infoWindow.open({ anchor: marker, map });
      google.maps.event.addListenerOnce(infoWindow, 'domready', () => {
        const link = document.querySelector('#map [data-open]');
        if (link) link.addEventListener('click', ev => { ev.preventDefault(); openDetail(link.dataset.open); });
      });
    });
    return marker;
  });
  if (fit) fitAll();
}
function fitAll() {
  if (!map || !window.google?.maps) return;
  const pts = items.filter(i => i.lat != null && i.lon != null);
  if (me) pts.push({ lat: me.lat, lon: me.lon });
  if (pts.length > 1) {
    const bounds = new google.maps.LatLngBounds();
    pts.forEach(p => bounds.extend({ lat: Number(p.lat), lng: Number(p.lon) }));
    map.fitBounds(bounds, 50);
    google.maps.event.addListenerOnce(map, 'idle', () => { if (map.getZoom() > 16) map.setZoom(16); });
  } else if (pts.length === 1) {
    map.setCenter({ lat: Number(pts[0].lat), lng: Number(pts[0].lon) });
    map.setZoom(15);
  }
}
function updateMe() {
  if (!map || !me || !window.google?.maps) return;
  const position = { lat: me.lat, lng: me.lon };
  if (!meMarker) meMarker = new google.maps.Marker({
    position, map, title: 'Ma position',
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#2f80ff', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 }
  });
  else meMarker.setPosition(position);
}
$('#btnMe').onclick = () => {
  if (me && map) { map.setCenter({ lat: me.lat, lng: me.lon }); map.setZoom(16); }
  else toast('Position indisponible : active la localisation');
};
$('#btnAll').onclick = fitAll;

/* ---------- sauvegarde / import ---------- */
$('#btnExport').onclick = () => {
  if (!items.length) { toast('Rien à sauvegarder'); return; }
  const blob = new Blob([JSON.stringify(items)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'resto-notes-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
};
/* ---------- démarrage ---------- */
(async () => {
  try { await DB.open(); items = await DB.all(); } catch (e) { toast('Stockage indisponible'); }
  startCam();
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(p => { me = { lat: p.coords.latitude, lon: p.coords.longitude }; updateMe(); }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
  }
})();
</script>
